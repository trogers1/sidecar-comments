name: CLI verification and releases
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Stable version increment
        required: true
        type: choice
        options: [patch, minor, major]
      homebrew_tag:
        description: 'Tap-only retry for an already published stable tag (leave empty for a release)'
        required: false
        type: string
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: read
jobs:
  plan:
    if: inputs.homebrew_tag == ''
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
      ref: ${{ steps.plan.outputs.ref }}
      base: ${{ steps.plan.outputs.base }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - id: plan
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_BUMP: ${{ inputs.bump }}
        run: python3 scripts/manual_release.py plan
  verify:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: darwin/arm64
            artifact: darwin_arm64
          - runner: ubuntu-24.04
            platform: linux/amd64
            artifact: linux_amd64
    runs-on: ${{ matrix.runner }}
    env:
      RELEASE_REF: ${{ needs.plan.outputs.ref || (startsWith(github.ref, 'refs/tags/') && github.ref || 'refs/heads/main') }}
      RELEASE_SHA: ${{ needs.plan.outputs.sha || github.sha }}
      RELEASE_PLATFORM: ${{ matrix.platform }}
      RELEASE_STAGE: .tmp/release-stage
      RELEASE_OUT: .tmp/release-assets
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          ref: ${{ needs.plan.outputs.sha || github.sha }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - run: bash scripts/release.sh build
      - run: bash scripts/release.sh verify
      - run: bash scripts/release.sh package
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-${{ matrix.artifact }}
          path: .tmp/release-assets/*
          if-no-files-found: error
  publish:
    needs: [plan, verify]
    outputs:
      stable_tag: ${{ steps.homebrew.outputs.stable_tag }}
    if: inputs.homebrew_tag == '' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: release-publication
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_REF: ${{ needs.plan.outputs.ref || github.ref }}
      RELEASE_SHA: ${{ needs.plan.outputs.sha || github.sha }}
      RELEASE_BASE: ${{ needs.plan.outputs.base }}
      RELEASE_BUMP: ${{ inputs.bump }}
      RELEASE_MODE: ${{ github.event_name == 'workflow_dispatch' && 'manual' || 'existing' }}
      RELEASE_OUT: .tmp/release-assets
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          ref: ${{ needs.plan.outputs.sha || github.sha }}
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: release-*
          merge-multiple: true
          path: .tmp/release-assets
      - run: bash scripts/publish.sh
      - id: homebrew
        run: |
          if [[ "$RELEASE_REF" == refs/tags/v* ]]; then
            printf 'stable_tag=%s\n' "${RELEASE_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi
  homebrew:
    needs: publish
    if: >-
      always() && !cancelled() &&
      ((needs.publish.result == 'success' && needs.publish.outputs.stable_tag != '') ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.homebrew_tag != ''))
    runs-on: ubuntu-24.04
    concurrency:
      group: homebrew-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Update Homebrew tap from published stable release
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          HOMEBREW_TAG: ${{ needs.publish.outputs.stable_tag || inputs.homebrew_tag }}
        run: |
          test -n "$GH_TOKEN" || { echo 'HOMEBREW_TAP_TOKEN is required' >&2; exit 1; }
          python3 scripts/update_homebrew.py "$HOMEBREW_TAG"
